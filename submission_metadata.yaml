compute_environment: "Linux/WSL, 16GB RAM, Python 3.12"

methodology: |
  Multi-dimensional ranking (7 signals, weighted):
  
  1. Title (20%) - AI/ML/Search engineer preferred
  2. Career (25%) - Keywords: ranking, recommendation, retrieval, embeddings
  3. Company (10%) - Product > consulting
  4. Behavior (20%) - Activity, recruiter engagement, interviews
  5. Location (5%) - Target cities + relocation willingness
  6. Experience (5%) - 6-8 years ideal
  7. Honeypot Detection - Trust multiplier for suspicious profiles
  
  Why: Career evidence beats keywords. Fast CPU-only (65 sec).
  No GPU, no network calls, specific reasoning per candidate.


reproducibility:
  command: "python rank.py --candidates candidates.jsonl --output team_pseudoclan.csv"
  expected_time: "under 5 minutes"
  expected_memory: "2-3 GB"
  language: "Python 3.12"
  dependencies: "See requirements.txt"
